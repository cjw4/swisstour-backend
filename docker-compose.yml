services:
  postgres:
    image: postgres:18-alpine
    container_name: swiss-dg-db
    environment:
      POSTGRES_DB: swiss-dg-db
      POSTGRES_USER: ${DB_USERNAME_DEV}
      POSTGRES_PASSWORD: ${DB_PASSWORD_DEV}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME_DEV} -d swiss-dg-db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
